<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#FFF7EE;color:#2B2140;padding:20px}
.box{width:100%;max-width:380px;background:#fff;border:1px solid #EADFD3;border-radius:22px;padding:32px 28px;box-shadow:0 18px 40px rgba(43,33,64,.08)}
.brand{font-weight:800;font-size:22px}.brand b{color:#EE6C4D}
.tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:#1F8A70;color:#fff;padding:3px 9px;border-radius:999px;vertical-align:middle}
p{color:#6B6380;font-size:14px;margin:8px 0 20px}
label{display:block;font-size:13px;font-weight:600;color:#6B6380;margin-bottom:12px}
input{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1px solid #EADFD3;border-radius:12px;font:inherit;font-size:15px}
input:focus{outline:2px solid #1F8A70;border-color:transparent}
button{width:100%;margin-top:6px;border:0;border-radius:999px;padding:12px;font:inherit;font-weight:700;font-size:15px;background:#EE6C4D;color:#fff;cursor:pointer}
button:hover{background:#C2462A}button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;color:#B42318;font-size:13px;font-weight:600;margin-top:12px;text-align:center}
.back{display:block;text-align:center;margin-top:16px;font-size:13px;color:#1F8A70;font-weight:600;text-decoration:none}
</style>
</head>

async function open(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(D.i)},k,ub(D.c));
  const html=new TextDecoder().decode(pt);
  if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r,{once:true}));
  document.open();document.write(html);document.close();
}
async function derive(u,p){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u.trim().toLowerCase()+'\n'+p),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:ub(D.s),iterations:D.n},base,256);
}
